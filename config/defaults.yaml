instructor:
  name: "{{Your full name}}"   # full identity + contact channels: config/instructor-profile.md

defaults:
  research: false
  generate_notebook_when_useful: true
  generate_slides: true
  create_instructor_notes: true
  include_assessments: true
  workflow_mode: interactive   # interactive | full
  session_agenda_blocks:       # menu, not a mandatory per-session sequence
    - Opening
    - Review
    - Explanation
    - Activity
    - Practice
    - Break
    - Assessment
    - Recap

# Optional institution-specific rule sets. All are off by default.
# Turn one on only if you submit courses to that institution.
institutional_requirements:
  # "حقيبة الكورسات" (Course Bag) program: 6-hour minimum, certificate only
  # at 20+ hours, 13-field submission draft + timetable.xlsx.
  # Rules: references/institutional-requirements/course-bag-program.md
  course_bag_program: false
